<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多地区 SQL 执行器</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --line: #d8dee9;
      --text: #1f2937;
      --muted: #6b7280;
      --blue: #2f7bd9;
      --blue-dark: #1f63b5;
      --ok: #16a34a;
      --warn: #f59e0b;
      --err: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    .container {
      width: min(1200px, calc(100% - 24px));
      margin: 12px auto 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
    }
    .panel-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .region-checks {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .region-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      gap: 10px 12px;
      align-items: center;
    }
    .label {
      font-size: 14px;
      color: #374151;
    }
    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid #bfc7d4;
      border-radius: 2px;
      padding: 7px 8px;
      font-size: 14px;
      color: #111827;
      background: #fff;
    }
    textarea {
      min-height: 62px;
      resize: vertical;
      line-height: 1.35;
    }
    button {
      border: 1px solid #bfc7d4;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      border-radius: 2px;
      padding: 8px 12px;
      cursor: pointer;
      transition: 0.12s ease;
    }
    button:hover { border-color: #96a3b8; }
    button.primary {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    button.primary:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }
    button:disabled {
      opacity: 0.6;
      cursor: default;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: #9ca3af;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.ok { background: var(--ok); }
    .status-dot.warn { background: var(--warn); }
    .status-dot.err { background: var(--err); }
    .progress-wrap {
      width: 100%;
      border: 1px solid #c7cfdb;
      background: #f3f4f6;
      border-radius: 2px;
      height: 26px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #93c5fd, #3b82f6);
      transition: width 0.25s ease;
    }
    .progress-text {
      position: absolute;
      top: 0;
      right: 8px;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #111827;
      text-shadow: 0 0 2px rgba(255,255,255,0.8);
    }
    .log-box {
      margin-top: 8px;
      background: #0f172a;
      color: #e5e7eb;
      border: 1px solid #1e293b;
      border-radius: 4px;
      padding: 10px;
      min-height: 240px;
      max-height: 360px;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .template-list {
      margin-top: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      background: #fafafa;
      font-size: 13px;
      max-height: 140px;
      overflow: auto;
    }
    .template-item {
      padding: 2px 0;
    }
    @media (max-width: 900px) {
      .config-grid {
        grid-template-columns: 1fr;
      }
      .config-grid > .label {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h1 class="panel-title">多地区 SQL 执行器（txt 模板）</h1>
      <div class="hint">支持直接填写 mssql+pymssql 连接串；SQL 模板仅读取 <strong>.txt</strong> 文件。</div>
    </section>

    <section class="panel">
      <div class="label"><strong>这次要跑的地区（可多选，一次执行）</strong></div>
      <div id="regionChecks" class="region-checks"></div>
    </section>

    <section class="panel">
      <div class="label"><strong>地区配置（每个地区自己的连接串 / TXT SQL目录 / 输出目录）</strong></div>
      <div class="row" style="margin: 10px 0 12px;">
        <span class="label">正在编辑</span>
        <select id="editRegionSelect" style="max-width: 220px;"></select>
        <span id="configSavedHint" class="hint"></span>
      </div>

      <div class="config-grid">
        <div class="label">数据库连接</div>
        <textarea id="connInput" spellcheck="false"></textarea>
        <button id="testConnBtn">测试连接</button>

        <div class="label">TXT 模板目录</div>
        <input id="templateDirInput" type="text" placeholder="例如 Data-NZ">
        <button id="scanTemplateBtn">读取TXT</button>

        <div class="label">输出文件夹</div>
        <input id="outputDirInput" type="text" placeholder="例如 Output-NZ">
        <button id="openOutputHintBtn">提示路径</button>
      </div>

      <div id="templateList" class="template-list">尚未读取模板目录。</div>
    </section>

    <section class="panel">
      <div class="label"><strong>自动调度设置（页面打开时生效）</strong></div>
      <div class="row" style="margin: 10px 0;">
        <span class="label">执行频率</span>
        <input id="freqValueInput" type="number" min="1" value="30" style="max-width: 90px;">
        <select id="freqUnitSelect" style="max-width: 110px;">
          <option value="minute">分钟</option>
          <option value="hour">小时</option>
        </select>
        <span class="label">下次执行</span>
        <span id="nextRunText" class="hint">未调度</span>
      </div>

      <div class="btn-group">
        <button id="runNowBtn" class="primary">立即执行一次</button>
        <button id="startScheduleBtn" class="primary">开始自动调度</button>
        <button id="stopScheduleBtn">停止自动调度</button>
        <button id="saveConfigBtn">保存配置</button>
      </div>
    </section>

    <section class="panel">
      <div class="status-line">
        <div>
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">就绪</span>
        </div>
        <div id="summaryText" class="hint">尚未执行任务</div>
      </div>
      <div class="progress-wrap" style="margin-top: 10px;">
        <div id="progressBar" class="progress-bar"></div>
        <div id="progressText" class="progress-text">0%</div>
      </div>
    </section>

    <section class="panel">
      <div class="label"><strong>执行日志</strong></div>
      <div id="logBox" class="log-box">等待执行...</div>
    </section>
  </div>

  <script>
    const state = {
      config: null,
      regionOrder: ["NZ", "AU", "CA"],
      editRegion: "NZ",
      selectedRegions: new Set(["NZ"]),
      busy: false,
      timer: null
    };

    const refs = {
      regionChecks: document.getElementById("regionChecks"),
      editRegionSelect: document.getElementById("editRegionSelect"),
      connInput: document.getElementById("connInput"),
      templateDirInput: document.getElementById("templateDirInput"),
      outputDirInput: document.getElementById("outputDirInput"),
      scanTemplateBtn: document.getElementById("scanTemplateBtn"),
      openOutputHintBtn: document.getElementById("openOutputHintBtn"),
      testConnBtn: document.getElementById("testConnBtn"),
      saveConfigBtn: document.getElementById("saveConfigBtn"),
      runNowBtn: document.getElementById("runNowBtn"),
      startScheduleBtn: document.getElementById("startScheduleBtn"),
      stopScheduleBtn: document.getElementById("stopScheduleBtn"),
      freqValueInput: document.getElementById("freqValueInput"),
      freqUnitSelect: document.getElementById("freqUnitSelect"),
      nextRunText: document.getElementById("nextRunText"),
      configSavedHint: document.getElementById("configSavedHint"),
      templateList: document.getElementById("templateList"),
      logBox: document.getElementById("logBox"),
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      summaryText: document.getElementById("summaryText"),
      progressBar: document.getElementById("progressBar"),
      progressText: document.getElementById("progressText")
    };

    function nowText() {
      return new Date().toLocaleTimeString();
    }

    function appendLog(text) {
      refs.logBox.textContent += `\n[${nowText()}] ${text}`;
      refs.logBox.scrollTop = refs.logBox.scrollHeight;
    }

    function clearLog(text) {
      refs.logBox.textContent = `[${nowText()}] ${text}`;
    }

    function setBusy(flag) {
      state.busy = flag;
      const disabled = flag;
      refs.scanTemplateBtn.disabled = disabled;
      refs.testConnBtn.disabled = disabled;
      refs.saveConfigBtn.disabled = disabled;
      refs.runNowBtn.disabled = disabled;
      refs.startScheduleBtn.disabled = disabled;
    }

    function setStatus(kind, text) {
      refs.statusDot.className = "status-dot";
      if (kind === "ok") refs.statusDot.classList.add("ok");
      if (kind === "warn") refs.statusDot.classList.add("warn");
      if (kind === "err") refs.statusDot.classList.add("err");
      refs.statusText.textContent = text;
    }

    function setProgress(value) {
      const safe = Math.max(0, Math.min(100, Number(value) || 0));
      refs.progressBar.style.width = `${safe}%`;
      refs.progressText.textContent = `${safe.toFixed(0)}%`;
    }

    function currentRegionConfig() {
      if (!state.config) return null;
      return state.config.regions[state.editRegion];
    }

    function renderRegionChecks() {
      refs.regionChecks.innerHTML = "";
      state.regionOrder.forEach((region) => {
        const cfg = state.config.regions[region] || {};
        const label = cfg.label || region;
        const wrap = document.createElement("label");
        wrap.className = "region-check";
        const check = document.createElement("input");
        check.type = "checkbox";
        check.checked = state.selectedRegions.has(region);
        check.addEventListener("change", () => {
          if (check.checked) state.selectedRegions.add(region);
          else state.selectedRegions.delete(region);
          if (!state.selectedRegions.size) {
            state.selectedRegions.add(region);
            check.checked = true;
          }
        });
        const text = document.createElement("span");
        text.textContent = `${label} (${region})`;
        wrap.appendChild(check);
        wrap.appendChild(text);
        refs.regionChecks.appendChild(wrap);
      });
    }

    function renderEditRegionOptions() {
      refs.editRegionSelect.innerHTML = "";
      state.regionOrder.forEach((region) => {
        const cfg = state.config.regions[region] || {};
        const opt = document.createElement("option");
        opt.value = region;
        opt.textContent = `${region} ${cfg.label || ""}`.trim();
        refs.editRegionSelect.appendChild(opt);
      });
      refs.editRegionSelect.value = state.editRegion;
    }

    function renderRegionForm() {
      const cfg = currentRegionConfig() || {};
      refs.connInput.value = cfg.connection_uri || "";
      refs.templateDirInput.value = cfg.template_dir || "";
      refs.outputDirInput.value = cfg.output_dir || "";
      refs.templateList.textContent = "尚未读取模板目录。";
    }

    function syncFormToState() {
      const cfg = currentRegionConfig();
      if (!cfg) return;
      cfg.connection_uri = refs.connInput.value.trim();
      cfg.template_dir = refs.templateDirInput.value.trim();
      cfg.output_dir = refs.outputDirInput.value.trim();
      refs.configSavedHint.textContent = "有未保存改动";
    }

    async function fetchConfig() {
      const res = await fetch("/api/runner-config");
      const data = await res.json();
      if (!res.ok || data.status !== "success") {
        throw new Error(data.message || "读取配置失败");
      }
      state.config = data.data;
      if (state.config.settings) {
        refs.freqValueInput.value = state.config.settings.frequency_value || 30;
        refs.freqUnitSelect.value = state.config.settings.frequency_unit || "minute";
      }
      refs.nextRunText.textContent = data.data.meta?.nextRunHint || "未调度";
      renderRegionChecks();
      renderEditRegionOptions();
      renderRegionForm();
      refs.configSavedHint.textContent = "已加载";
      setStatus("ok", "配置已加载");
    }

    async function saveConfig() {
      syncFormToState();
      state.config.settings = state.config.settings || {};
      state.config.settings.frequency_value = Number(refs.freqValueInput.value || 30);
      state.config.settings.frequency_unit = refs.freqUnitSelect.value;

      setBusy(true);
      try {
        const res = await fetch("/api/runner-config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state.config)
        });
        const data = await res.json();
        if (!res.ok || data.status !== "success") {
          throw new Error(data.message || "保存失败");
        }
        state.config = data.data;
        refs.configSavedHint.textContent = "已保存";
        appendLog("配置保存成功。");
        setStatus("ok", "配置已保存");
      } catch (err) {
        appendLog(`配置保存失败: ${err.message || err}`);
        setStatus("err", "配置保存失败");
      } finally {
        setBusy(false);
      }
    }

    async function scanTemplates() {
      syncFormToState();
      setBusy(true);
      try {
        const url = `/api/runner/templates?region=${encodeURIComponent(state.editRegion)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!res.ok || data.status !== "success") {
          throw new Error(data.message || "读取模板失败");
        }
        if (!data.files.length) {
          refs.templateList.textContent = `目录 ${data.templateDir} 下没有 .txt 模板。`;
        } else {
          refs.templateList.innerHTML = data.files.map(name => `<div class="template-item">${name}</div>`).join("");
        }
        appendLog(`[${state.editRegion}] 找到 ${data.count} 个 txt 模板。`);
        setStatus("ok", "模板读取成功");
      } catch (err) {
        refs.templateList.textContent = `读取失败：${err.message || err}`;
        appendLog(`[${state.editRegion}] 模板读取失败: ${err.message || err}`);
        setStatus("err", "模板读取失败");
      } finally {
        setBusy(false);
      }
    }

    async function testConnection() {
      syncFormToState();
      setBusy(true);
      try {
        const res = await fetch("/api/runner/test-connection", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ region: state.editRegion })
        });
        const data = await res.json();
        if (data.status !== "success") {
          throw new Error(data.message || "连接失败");
        }
        appendLog(`[${state.editRegion}] 连接成功。驱动: ${(data.drivers || []).join(", ") || "-"}`);
        setStatus("ok", "连接测试成功");
      } catch (err) {
        appendLog(`[${state.editRegion}] 连接测试失败: ${err.message || err}`);
        setStatus("err", "连接测试失败");
      } finally {
        setBusy(false);
      }
    }

    function selectedRegionList() {
      return Array.from(state.selectedRegions);
    }

    function applyRunSummary(payload) {
      const summary = payload.summary || {};
      refs.summaryText.textContent = `地区: ${summary.regions || 0} | 成功: ${summary.success || 0} | 部分成功: ${summary.partial || 0} | 警告: ${summary.warning || 0} | 失败: ${summary.error || 0}`;
      if (payload.status === "success") setStatus("ok", "执行完成");
      else if (payload.status === "partial") setStatus("warn", "执行部分成功");
      else setStatus("err", "执行失败");
    }

    async function runNow(fromSchedule = false) {
      syncFormToState();
      const regions = selectedRegionList();
      if (!regions.length) {
        setStatus("err", "请至少选择一个地区");
        return;
      }

      setBusy(true);
      setStatus("warn", fromSchedule ? "自动调度执行中..." : "执行中...");
      setProgress(15);
      clearLog(`开始执行地区: ${regions.join(", ")}`);
      try {
        const res = await fetch("/api/runner/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ regions })
        });
        setProgress(70);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || "执行失败");
        }

        (data.results || []).forEach((regionResult) => {
          appendLog(`=== ${regionResult.region} / ${regionResult.label} / ${regionResult.status} ===`);
          (regionResult.logs || []).forEach((line) => appendLog(line));
        });

        applyRunSummary(data);
        setProgress(100);
      } catch (err) {
        appendLog(`执行失败: ${err.message || err}`);
        setStatus("err", "执行失败");
        setProgress(100);
      } finally {
        setBusy(false);
      }
    }

    function stopSchedule() {
      if (state.timer) {
        clearInterval(state.timer);
        state.timer = null;
      }
      refs.nextRunText.textContent = "未调度";
      appendLog("已停止自动调度。");
      setStatus("ok", "已停止自动调度");
    }

    function nextRunAtText() {
      const value = Math.max(1, Number(refs.freqValueInput.value || 30));
      const unit = refs.freqUnitSelect.value;
      const ms = unit === "hour" ? value * 3600 * 1000 : value * 60 * 1000;
      return new Date(Date.now() + ms).toLocaleString();
    }

    function startSchedule() {
      const value = Math.max(1, Number(refs.freqValueInput.value || 30));
      const unit = refs.freqUnitSelect.value;
      const ms = unit === "hour" ? value * 3600 * 1000 : value * 60 * 1000;

      stopSchedule();
      refs.nextRunText.textContent = nextRunAtText();
      appendLog(`自动调度已启动，每 ${value} ${unit === "hour" ? "小时" : "分钟"}执行一次。`);
      setStatus("ok", "自动调度运行中");
      state.timer = setInterval(async () => {
        refs.nextRunText.textContent = nextRunAtText();
        await runNow(true);
      }, ms);
    }

    function bindEvents() {
      refs.editRegionSelect.addEventListener("change", () => {
        syncFormToState();
        state.editRegion = refs.editRegionSelect.value;
        renderRegionForm();
      });
      refs.connInput.addEventListener("input", syncFormToState);
      refs.templateDirInput.addEventListener("input", syncFormToState);
      refs.outputDirInput.addEventListener("input", syncFormToState);
      refs.scanTemplateBtn.addEventListener("click", scanTemplates);
      refs.testConnBtn.addEventListener("click", testConnection);
      refs.saveConfigBtn.addEventListener("click", saveConfig);
      refs.runNowBtn.addEventListener("click", () => runNow(false));
      refs.startScheduleBtn.addEventListener("click", startSchedule);
      refs.stopScheduleBtn.addEventListener("click", stopSchedule);
      refs.openOutputHintBtn.addEventListener("click", () => {
        const cfg = currentRegionConfig();
        appendLog(`[${state.editRegion}] 当前输出目录: ${cfg?.output_dir || "-"}`);
      });
    }

    async function init() {
      setProgress(0);
      setStatus("warn", "初始化中...");
      bindEvents();
      try {
        await fetchConfig();
        clearLog("系统就绪，等待执行。");
        setProgress(0);
      } catch (err) {
        clearLog(`初始化失败: ${err.message || err}`);
        setStatus("err", "初始化失败");
      }
    }

    init();
  </script>
</body>
</html>
